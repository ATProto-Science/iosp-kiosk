<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — IOSP 2026</title>
  <link rel="stylesheet" href="https://hacking.tilde.style/site.css">
</head>
<body class="clearing">
  <header class="hearth"><div class="hearth-inner">
    <h1 class="site-name">You're in 🎉</h1>
    <p class="site-tagline">Your account is ready.</p>
  </div></header>
  <main><section class="gathered"><div class="gathered-inner"><div class="style-card">
    <p id="msg">Finishing up…</p>
    <p><a class="spark" href="https://hacking.tilde.style/">Continue to the workshop stations →</a></p>
  </div></div></section></main>
  <script type="module">
    import { restoreSession } from "/oauth.js";
    import { Agent } from "https://esm.sh/@atproto/api@0.13";
    const CHECKIN_COLLECTION = "style.tilde.hacking.checkin";
    const msg = document.getElementById("msg");

    // Best-effort, same spirit as landing-page/index.html's memo.dog equivalent: never
    // blocks or fails the welcome message. Confirmed working live 2026-09-29 (via
    // debug-login.html, an existing account, no invite code needed) — the granted
    // repo:style.tilde.hacking.checkin scope does let this write succeed.
    async function recordAsterCheckin(session, did) {
      try {
        const agent = new Agent(session);
        await agent.com.atproto.repo.createRecord({
          repo: did,
          collection: CHECKIN_COLLECTION,
          record: { $type: CHECKIN_COLLECTION, track: "aster", createdAt: new Date().toISOString() },
        });
      } catch (err) {
        console.warn("aster check-in record failed:", err.message);
      }
    }

    try {
      const r = await restoreSession();
      if (!r) msg.textContent = "Nothing to finish here — if you meant to sign up, open your ticket link.";
      else {
        const did = r.session.did;
        let handle = did;
        try { // public lookup on the account's own PDS
          // .aud can come back with a trailing slash (confirmed live 2026-09-29: aster.id's
          // did) — strip it, or the request 404s on a doubled "//xrpc/" path.
          const issuer = (await r.session.getTokenInfo()).aud.replace(/\/$/, "");
          const d = await (await fetch(`${issuer}/xrpc/com.atproto.repo.describeRepo?repo=${encodeURIComponent(did)}`)).json();
          if (d.handle) handle = "@" + d.handle;
        } catch {}
        msg.textContent = `Welcome, ${handle}!`;
        recordAsterCheckin(r.session, did);
      }
    } catch (e) { msg.textContent = "Signup finished, but we couldn't confirm the session: " + e.message; }
  </script>
</body>
</html>
